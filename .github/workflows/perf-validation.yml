name: Scanner capacity experiment (not approved)

on:
  push:
    branches:
      - perf/validate-scanner-capacity-299aa70

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASELINE: 299aa70be62dfcb7e45896388e893b8a216a2f3c
    steps:
      - name: Check out experiment harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use documented Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
      - name: Install pinned WASI SDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  '"$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Prepare isolated source copies and dependency snapshot
        run: |
          set -euo pipefail
          mkdir -p work/baseline work/candidate validation/baseline validation/candidate
          git archive "$BASELINE" | tar -x -C work/baseline
          cp -a work/baseline/. work/candidate/
          patch --batch --fuzz=0 -p1 -d work/candidate < experiments/perf/scanner-capacity.patch
          npm --prefix work/baseline/bench install --ignore-scripts --no-audit --no-fund
          cp -a work/baseline/bench/node_modules work/candidate/bench/
          cp work/baseline/bench/package-lock.json validation/dependencies-package-lock.json
          { uname -a; node --version; clang --version; "$WASI_SDK/bin/clang" --version; git rev-parse HEAD; } > validation/environment.txt
      - name: Build baseline and candidate WASM
        run: |
          set -euo pipefail
          for build in baseline candidate; do
            (cd "work/$build" && sh scripts/build.sh) | tee "validation/$build/build.txt"
            cp "work/$build/tree-sitter-md.wasm" "validation/$build/tree-sitter-md.wasm"
            sha256sum "work/$build/tree-sitter-md.wasm" > "validation/$build/wasm-sha256.txt"
          done
          cmp tree-sitter-md.wasm work/baseline/tree-sitter-md.wasm
      - name: Focused tests, native sanitizers and scanner state tests
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            (cd "work/$build" && npm test) > "validation/$build/focused-tests.txt" 2>&1 || status=1
            (cd "work/$build" && sh scripts/check-native.sh) > "validation/$build/native-tests.txt" 2>&1 || status=1
            reuse=0; if [ "$build" = candidate ]; then reuse=1; fi
            clang -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -std=c11 -DEXPECT_REUSE="$reuse" -I"work/$build/grammar/src" experiments/perf/scanner-state.c -o "validation/$build/scanner-state" || status=1
            ASAN_OPTIONS=detect_leaks=1 "validation/$build/scanner-state" > "validation/$build/scanner-state.txt" 2>&1 || status=1
          done
          exit "$status"
      - name: Public spec floors and three-seed fuzz checks
        if: always()
        run: |
          status=0
          for build in baseline candidate; do
            node experiments/perf/public-checks.mjs "work/$build" "validation/$build" > "validation/$build/public-checks-output.txt" 2>&1 || status=1
          done
          exit "$status"
      - name: Compare all spec outcomes exactly
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p));
          assert.deepEqual(read('validation/baseline/spec-results.json'),read('validation/candidate/spec-results.json'));
          console.log('All 676 per-example outcomes are identical');
          JS
      - name: Diagnostic paired timings, not an acceptance gate
        if: always()
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5 6; do
            order='baseline candidate'; if [ $((round % 2)) -eq 0 ]; then order='candidate baseline'; fi
            for build in $order; do
              BUILD_LABEL="$build" ROUND="$round" node experiments/perf/keystroke-isolated.mjs "work/$build" > "validation/$build/bench-$round.jsonl"
            done
          done
          for build in baseline candidate; do
            (cd "work/$build" && node bench/memory.mjs) > "validation/$build/memory.jsonl"
          done
      - name: Additional reference regression blocks acceptance
        if: always()
        run: |
          status=0
          for build in baseline candidate; do
            node experiments/perf/reference-invalidation.mjs "work/$build" > "validation/$build/reference-invalidation.txt" 2>&1 || status=1
          done
          exit "$status"
      - name: Mandatory private corpus gate is unavailable
        if: always()
        run: |
          mkdir -p validation
          printf '%s\n' 'NOT APPROVED: the additional reference regression fails the pinned baseline.' 'The original private 183-message CHAT corpus and pinned Platform/Editor checkouts were not supplied to this runner.' 'No corpus results are fabricated or substituted, and no optimization PR may be opened from this run.' > validation/NOT-APPROVED.txt
          cat validation/NOT-APPROVED.txt
          exit 1
      - name: Preserve all evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-capacity-validation
          path: validation/
          retention-days: 7
          if-no-files-found: error
