name: Cursor hidden-gap correctness validation

on:
  push:
    branches: [fix/cursor-hidden-gaps-e819c44]
  pull_request:
    paths:
      - vendor/tree-sitter/src/tree_cursor.c
      - tests/cursor-seek.c
      - tests/reference-boundaries.mjs
      - scripts/check-cursor.sh
      - .github/workflows/cursor-fix-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      BASELINE: e819c44004cfb8622857cfe74a37a342a07aa9b1
      HARNESS: 06971c1d152c516082af5f7237b20eda62a9dd42
      FIXED_CURSOR_SHA256: b7c5952fb274486fd3f3ef4db25345f2bd7e69753fae7380d5570d00a74bb9c6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
      - name: Prepare isolated baseline and candidate with exact corpus revisions
        run: |
          set -euo pipefail
          mkdir -p work/baseline work/candidate validation/baseline validation/candidate
          git archive "$BASELINE" | tar -x -C work/baseline
          git archive HEAD | tar -x -C work/candidate
          git archive "$HARNESS" experiments/perf | tar -x
          current=$(sha256sum work/candidate/vendor/tree-sitter/src/tree_cursor.c | cut -d' ' -f1)
          if [ "$current" != "$FIXED_CURSOR_SHA256" ]; then
            patch --batch --fuzz=0 -p1 -d work/candidate < experiments/cursor-seek/fix.patch
          else
            cp work/candidate/tree-sitter-md.wasm validation/candidate/committed.wasm
          fi
          echo "$FIXED_CURSOR_SHA256  work/candidate/vendor/tree-sitter/src/tree_cursor.c" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/candidate/vendor/README.md')
          text=p.read_text()
          if '## Tree-sitter cursor correction' not in text:
              text+='\n## Tree-sitter cursor correction\n\nThe runtime also contains a correction for byte/point first-child seeks into a hidden subtree\nwhose trailing invisible content covers the query. Exhausting that subtree does not exclude a\nlater visible sibling. A failed hidden descent falls back to sequential visible-child traversal;\na genuine miss restores the original cursor. The fallback is linear in the queried node\'s visible\nchildren, so it is a correctness safeguard rather than a claimed optimization.\n\n`tests/cursor-seek.c` compares both seek APIs against an independent sequential oracle, including\nmiss-state restoration. `tests/reference-boundaries.mjs` covers reference-definition edits and\nviewport starts in invisible gaps. Run `sh scripts/check-cursor.sh` and `npm test`.\n'
          p.write_text(text)
          PY
          for item in 'platform fregat c130dd35a202dd06ccd160bd5ed0789c889315c2' 'editor singapore 74e76bef2af674ad80b3c13024fa47f692e2bb7c'; do
            read -r local_name repo sha <<< "$item"
            git init "$RUNNER_TEMP/$local_name"
            git -C "$RUNNER_TEMP/$local_name" fetch --depth=1 "https://github.com/ShaulLavo/$repo.git" "$sha"
            test "$(git -C "$RUNNER_TEMP/$local_name" rev-parse FETCH_HEAD)" = "$sha"
          done
          echo "PLATFORM=$RUNNER_TEMP/platform" >> "$GITHUB_ENV"
          echo "EDITOR_REPO=$RUNNER_TEMP/editor" >> "$GITHUB_ENV"
          echo '2c5c01ed08af3c921c8c500b6c9f50d9e48d39480bedc91355dc88377e9adbf1  work/baseline/bench/corpus/chat.json' | sha256sum -c - | tee validation/corpus-hash.txt
          npm --prefix work/baseline/bench install --ignore-scripts --no-audit --no-fund
          cp -a work/baseline/bench/node_modules work/candidate/bench/
          cp work/baseline/bench/package-lock.json validation/dependencies-package-lock.json
      - name: Build reproducible baseline and corrected WASM
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  '"$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          export WASI_SDK="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux"
          echo "WASI_SDK=$WASI_SDK" >> "$GITHUB_ENV"
          { uname -a; node --version; clang --version; "$WASI_SDK/bin/clang" --version; git rev-parse HEAD; } > validation/environment.txt
          for build in baseline candidate; do
            (cd "work/$build" && sh scripts/build.sh) | tee "validation/$build/build.txt"
            cp "work/$build/tree-sitter-md.wasm" "validation/$build/tree-sitter-md.wasm"
            sha256sum "work/$build/tree-sitter-md.wasm" > "validation/$build/wasm-sha256.txt"
          done
          git show "$BASELINE:tree-sitter-md.wasm" | cmp - work/baseline/tree-sitter-md.wasm
          if [ -f validation/candidate/committed.wasm ]; then
            cmp validation/candidate/committed.wasm work/candidate/tree-sitter-md.wasm
          fi
      - name: Existing and added WASM tests plus native sanitizers
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            (cd "work/$build" && npm test) > "validation/$build/focused.txt" 2>&1 || status=1
            (cd "work/$build" && sh scripts/check-native.sh) > "validation/$build/native.txt" 2>&1 || status=1
          done
          (cd work/candidate && sh scripts/check-cursor.sh) > validation/candidate/cursor-oracle.txt 2>&1 || status=1
          cat validation/candidate/cursor-oracle.txt
          exit "$status"
      - name: Prove added regressions detect the unchanged baseline
        if: always()
        run: |
          set -euo pipefail
          if WASM="$GITHUB_WORKSPACE/work/baseline/tree-sitter-md.wasm" node --test --test-reporter=tap work/candidate/tests/reference-boundaries.mjs > validation/baseline/reference-negative-control.txt 2>&1; then
            echo 'ERROR: reference regression did not fail the baseline'; exit 1
          fi
          grep '^# tests 73$' validation/baseline/reference-negative-control.txt
          grep '^# fail 73$' validation/baseline/reference-negative-control.txt
          cp tests/cursor-seek.c work/baseline/tests/
          cp scripts/check-cursor.sh work/baseline/scripts/
          if (cd work/baseline && sh scripts/check-cursor.sh) > validation/baseline/cursor-oracle-negative-control.txt 2>&1; then
            echo 'ERROR: cursor oracle did not fail the baseline'; exit 1
          fi
          grep '41504 comparisons, 136 failures' validation/baseline/cursor-oracle-negative-control.txt
      - name: Original full spec, chat, repository, fuzz and negative-control gates
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            (cd "work/$build" && CHAT="$GITHUB_WORKSPACE/work/$build/bench/corpus/chat.json" node scripts/check-gates.mjs) > "validation/$build/full-gates.txt" 2>&1 || status=1
            cat "validation/$build/full-gates.txt"
            cp -a "work/$build/bench/out" "validation/$build/out" || status=1
          done
          exit "$status"
      - name: Three-seed fuzz and exact per-example specification parity
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            node experiments/perf/public-checks.mjs "work/$build" "validation/$build" > "validation/$build/public-checks.txt" 2>&1 || status=1
          done
          node --input-type=module <<'JS' || status=1
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p));
          assert.deepEqual(read('validation/baseline/spec-results.json'),read('validation/candidate/spec-results.json'));
          assert.deepEqual(read('validation/baseline/out/corpus-stats.json'),read('validation/candidate/out/corpus-stats.json'));
          console.log('Exact 676-example and corpus-summary parity passed');
          JS
          exit "$status"
      - name: Six paired diagnostic benchmark rounds
        if: always()
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5 6; do
            order='baseline candidate'; if [ $((round % 2)) -eq 0 ]; then order='candidate baseline'; fi
            for build in $order; do
              BUILD_LABEL="$build" ROUND="$round" node experiments/perf/keystroke-isolated.mjs "work/$build" > "validation/$build/bench-$round.jsonl"
            done
          done
      - name: Publish only validated source and WASM to this isolated branch
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=fix/cursor-hidden-gaps-e819c44
          test "$GITHUB_REF" = "refs/heads/$branch"
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          cp work/candidate/vendor/tree-sitter/src/tree_cursor.c vendor/tree-sitter/src/tree_cursor.c
          cp work/candidate/vendor/README.md vendor/README.md
          cp work/candidate/tree-sitter-md.wasm tree-sitter-md.wasm
          git add vendor/tree-sitter/src/tree_cursor.c vendor/README.md tree-sitter-md.wasm
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve cursor seeks across hidden gaps and rebuild validated wasm'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          fi
          git rev-parse HEAD > validation/published-commit.txt
      - name: Preserve test evidence and corrected sources
        if: always()
        run: |
          mkdir -p validation/source
          cp work/candidate/vendor/tree-sitter/src/tree_cursor.c validation/source/tree_cursor.c
          cp tests/cursor-seek.c tests/reference-boundaries.mjs scripts/check-cursor.sh validation/source/
          cp -a experiments/perf validation/harness
          sha256sum validation/source/* > validation/source-sha256.txt
          tar -czf validation/replay-workspace.tar.gz -C work candidate
      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cursor-fix-validation
          path: validation/
          retention-days: 7
          if-no-files-found: error
