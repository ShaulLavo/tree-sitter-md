name: Corpus-backed scanner validation

on:
  push:
    branches: [test/validate-corpus-e819c44]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASELINE: e819c44004cfb8622857cfe74a37a342a07aa9b1
      HARNESS: 06971c1d152c516082af5f7237b20eda62a9dd42
    steps:
      - name: Check out validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use documented Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
      - name: Prepare exact source and corpus revisions
        run: |
          set -euo pipefail
          mkdir -p work/baseline work/candidate validation/baseline validation/candidate
          git archive "$BASELINE" | tar -x -C work/baseline
          git archive "$HARNESS" experiments/perf | tar -x
          cp -a work/baseline/. work/candidate/
          patch --batch --fuzz=0 -p1 -d work/candidate < experiments/perf/scanner-capacity.patch
          for item in 'platform fregat c130dd35a202dd06ccd160bd5ed0789c889315c2' 'editor singapore 74e76bef2af674ad80b3c13024fa47f692e2bb7c'; do
            read -r local_name repo sha <<< "$item"
            git init "$RUNNER_TEMP/$local_name"
            git -C "$RUNNER_TEMP/$local_name" fetch --depth=1 "https://github.com/ShaulLavo/$repo.git" "$sha"
            test "$(git -C "$RUNNER_TEMP/$local_name" rev-parse FETCH_HEAD)" = "$sha"
          done
          echo "PLATFORM=$RUNNER_TEMP/platform" >> "$GITHUB_ENV"
          echo "EDITOR_REPO=$RUNNER_TEMP/editor" >> "$GITHUB_ENV"
          echo '2c5c01ed08af3c921c8c500b6c9f50d9e48d39480bedc91355dc88377e9adbf1  work/baseline/bench/corpus/chat.json' | sha256sum -c - | tee validation/corpus-hash.txt
          npm --prefix work/baseline/bench install --ignore-scripts --no-audit --no-fund
          cp -a work/baseline/bench/node_modules work/candidate/bench/
          cp work/baseline/bench/package-lock.json validation/dependencies-package-lock.json
      - name: Install verified compiler and build both modules
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  '"$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          export WASI_SDK="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux"
          echo "WASI_SDK=$WASI_SDK" >> "$GITHUB_ENV"
          { uname -a; node --version; clang --version; "$WASI_SDK/bin/clang" --version; git rev-parse HEAD; } > validation/environment.txt
          for build in baseline candidate; do
            (cd "work/$build" && sh scripts/build.sh) | tee "validation/$build/build.txt"
            cp "work/$build/tree-sitter-md.wasm" "validation/$build/tree-sitter-md.wasm"
            sha256sum "work/$build/tree-sitter-md.wasm" > "validation/$build/wasm-sha256.txt"
          done
          cmp tree-sitter-md.wasm work/baseline/tree-sitter-md.wasm
      - name: Existing focused tests and native sanitizers
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            (cd "work/$build" && npm test) > "validation/$build/focused.txt" 2>&1 || status=1
            (cd "work/$build" && sh scripts/check-native.sh) > "validation/$build/native.txt" 2>&1 || status=1
            reuse=0; if [ "$build" = candidate ]; then reuse=1; fi
            clang -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -std=c11 -DEXPECT_REUSE="$reuse" -I"work/$build/grammar/src" experiments/perf/scanner-state.c -o "validation/$build/scanner-state" || status=1
            ASAN_OPTIONS=detect_leaks=1 "validation/$build/scanner-state" > "validation/$build/scanner-state.txt" 2>&1 || status=1
          done
          exit "$status"
      - name: Original full correctness gate including both corpora
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            CHAT="$GITHUB_WORKSPACE/work/$build/bench/corpus/chat.json" node_dir="$GITHUB_WORKSPACE/work/$build"
            (cd "$node_dir" && CHAT="$CHAT" node scripts/check-gates.mjs) > "validation/$build/full-gates.txt" 2>&1 || status=1
            cat "validation/$build/full-gates.txt"
            cp -a "work/$build/bench/out" "validation/$build/out" || status=1
          done
          exit "$status"
      - name: Additional three-seed fuzz and exact specification parity
        if: always()
        run: |
          set -uo pipefail
          status=0
          for build in baseline candidate; do
            node experiments/perf/public-checks.mjs "work/$build" "validation/$build" > "validation/$build/public-checks.txt" 2>&1 || status=1
          done
          node --input-type=module <<'JS' || status=1
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>JSON.parse(readFileSync(p));
          assert.deepEqual(read('validation/baseline/spec-results.json'),read('validation/candidate/spec-results.json'));
          assert.deepEqual(read('validation/baseline/out/corpus-stats.json'),read('validation/candidate/out/corpus-stats.json'));
          console.log('Exact 676-example and corpus-summary parity passed');
          JS
          exit "$status"
      - name: Paired timings remain diagnostic rather than proof of improvement
        if: always()
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5 6; do
            order='baseline candidate'; if [ $((round % 2)) -eq 0 ]; then order='candidate baseline'; fi
            for build in $order; do
              BUILD_LABEL="$build" ROUND="$round" node experiments/perf/keystroke-isolated.mjs "work/$build" > "validation/$build/bench-$round.jsonl"
            done
          done
      - name: Additional reference regression remains a mandatory gate
        if: always()
        run: |
          status=0
          for build in baseline candidate; do
            node experiments/perf/reference-invalidation.mjs "work/$build" > "validation/$build/reference-invalidation.txt" 2>&1 || status=1
            cat "validation/$build/reference-invalidation.txt"
          done
          exit "$status"
      - name: Preserve exact sources, dependencies and all results
        if: always()
        run: |
          cp -a experiments/perf validation/harness
          tar -czf validation/replay-workspace.tar.gz -C work baseline
          git diff "$BASELINE" -- .github/workflows/corpus-validation.yml > validation/workflow.diff
          printf '%s\n' 'Approval requires every correctness gate and a separately demonstrated performance benefit. A failed baseline regression is not waived by corpus parity.' > validation/APPROVAL-POLICY.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corpus-validation-e819c44
          path: validation/
          retention-days: 7
          if-no-files-found: error
