[package]
name = "tree-sitter-md"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Markdown for editors: a tree-sitter block grammar and a CommonMark inline resolver in one wasm module"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tsmd"
path = "src/bin/tsmd.rs"

[dependencies]
tree-sitter = "0.27.0"
tree-sitter-language = "0.1.8"
pulldown-cmark = { version = "0.13.4", default-features = false }

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.sizes]
inherits = "release"
strip = false
